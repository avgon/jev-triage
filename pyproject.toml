[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "jev-triage"
version = "0.1.0"
description = "Fast, structured ticket routing powered by Jev. No LLM latency, no hallucination."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Metin Kılagöz", email = "metin@avgon.dev"},
]
keywords = ["jev", "typesafe", "triage", "ticket-routing", "classification", "support"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/avgon/jev-triage"
Repository = "https://github.com/avgon/jev-triage"
Issues = "https://github.com/avgon/jev-triage/issues"
